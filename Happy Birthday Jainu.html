<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Jainu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #3a0814;
  --ink: #f6ead2;
  --ink-soft: #d9c7a3;
  --accent: #d8453a;
  --maroon: #8f1111;
  --display: "Abril Fatface", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #2c060f; } }
:root[data-theme="dark"] { --bg: #2c060f; }
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; overflow: hidden;
}
.stage {
  position: relative; container-type: inline-size;
  width: min(96vw, calc((100dvh - 110px) * 16 / 9));
  aspect-ratio: 16 / 9;
  background: #d9c7a3; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
}
.scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s; }
.scene.on { opacity: 1; visibility: visible; transition: opacity .6s ease; }
.scene > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }

.hit { position: absolute; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 6px; }
.hit:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* Cover: whole picture opens the card */
#cover .hit { inset: 0; border-radius: 0; }

/* Envelope */
#env .hit { left: 37%; top: 3%; width: 38%; height: 94%; }
#env .ring {
  position: absolute; left: 56%; top: 49%; width: 9cqw; height: 9cqw; margin: -4.5cqw 0 0 -4.5cqw;
  border-radius: 50%; border: .35cqw solid rgba(246,234,210,.85); pointer-events: none;
  animation: ring 2s ease-out infinite;
}
@keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }

/* Cake + flames */
.flame {
  position: absolute; width: 1.8cqw; height: 3.4cqw; transform: translate(-50%, -100%);
  transform-origin: 50% 100%; background: none; border: 0; padding: 0; cursor: pointer;
}
.flame::before { /* hit area */ content: ""; position: absolute; inset: -1.5cqw -2cqw; }
.flame i {
  position: absolute; inset: 0; display: block;
  background: radial-gradient(ellipse at 50% 72%, #fff7c2 0 18%, #ffc933 40%, #f08a1c 75%, rgba(240,90,20,0) 100%);
  border-radius: 50% 50% 50% 50% / 68% 68% 32% 32%;
  clip-path: polygon(50% 0, 88% 52%, 100% 78%, 50% 100%, 0 78%, 12% 52%);
  filter: drop-shadow(0 0 .8cqw rgba(255,190,60,.9));
  transform-origin: 50% 100%;
  animation: flick .9s ease-in-out infinite alternate;
}
.flame:nth-of-type(2) i { animation-duration: .75s; }
.flame:nth-of-type(3) i { animation-duration: 1.05s; }
@keyframes flick {
  0% { transform: scale(1, 1) rotate(-3deg); }
  50% { transform: scale(.94, 1.06) rotate(2deg); }
  100% { transform: scale(1.04, .96) rotate(-1deg); }
}
.flame.blowing i { animation: none; transform: rotate(calc(var(--lean, 0) * 1deg)) scale(1, .92); transition: transform .08s linear; }
.flame.out i { animation: snuff .35s ease-in forwards; }
@keyframes snuff { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(.1, .05); opacity: 0; } }
.flame.out { cursor: default; pointer-events: none; }
.smoke {
  position: absolute; width: .8cqw; height: 5cqw; transform: translate(-50%, -100%); pointer-events: none;
  background: linear-gradient(to top, rgba(90,70,60,.55), rgba(90,70,60,0));
  border-radius: 50%; filter: blur(.35cqw); opacity: 0; animation: smoke 2.4s ease-out forwards;
}
@keyframes smoke {
  0% { opacity: 0; transform: translate(-50%, -100%) scaleY(.3); }
  20% { opacity: .9; }
  100% { opacity: 0; transform: translate(-30%, -260%) scaleY(1.4) skewX(18deg); }
}
canvas#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* Controls under the stage */
.bar { min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.hint { margin: 0; font-size: clamp(.9rem, 2.4vw, 1.05rem); color: var(--ink-soft); }
.btn {
  font-family: var(--display); font-size: clamp(1rem, 2.8vw, 1.15rem); letter-spacing: .02em;
  background: var(--ink); color: var(--maroon); border: 0; border-radius: 999px;
  padding: .55em 1.3em; cursor: pointer; transition: transform .15s ease, background .15s ease;
}
.btn:hover { transform: translateY(-2px); background: #fff; }
.btn:active { transform: translateY(0); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(246,234,210,.55); }
.btn.ghost:hover { background: rgba(246,234,210,.12); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn[hidden], .hint[hidden] { display: none; }
.wish { margin: 0; font-family: var(--display); font-size: clamp(1.4rem, 5vw, 2.2rem); color: var(--ink); }

/* Letter overlay */
#letterWrap {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(30,4,10,.78); backdrop-filter: blur(3px);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(14px + env(safe-area-inset-bottom, 0px));
  opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s linear .5s;
}
#letterWrap.on { opacity: 1; visibility: visible; transition: opacity .5s ease; }
#letterWrap .paper {
  max-height: calc(100dvh - 120px); max-width: 100%; overflow: auto; border-radius: 3px;
  box-shadow: 0 24px 60px rgba(0,0,0,.55); transform: translateY(70%) rotate(-3deg) scale(.82); opacity: 0;
  transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
  background: #e0dcd5; line-height: 0;
}
#letterWrap.on .paper { transform: none; opacity: 1; transition-delay: .15s; }
#letterWrap img { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100dvh - 120px); }

@media (prefers-reduced-motion: reduce) {
  .scene, .scene.on, #letterWrap, #letterWrap .paper { transition-duration: .01s; transition-delay: 0s; }
  #env .ring, .flame i, .smoke { animation: none; }
  .smoke { display: none; }
}
</style>
</head>

 alone. No matter what, I will always be there for you, rooting for you. I love everything about you sweety: your smile, your eyes, how caring you are, and your ability to always make me laugh. I hope you know how strong you are, doing everything alone in a new country, literally building a new life. I hope you know how proud we all are. Your parents, Dadaji, your friends, Aarya and me, we are all so proud of you. I know you don't like celebrating your birthday, but I hope you do this year. Go out, have fun with your friends. Live your life to the fullest, don't regret anything. I can't wait to see you again and hug you and kiss you. Enjoy your day my love, I love you always and forever. Till we meet again. Aastha"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var scenes = { cover: $('#cover'), env: $('#env'), cake: $('#cake') };
  var hint = $('#hint'), wish = $('#wish'), row = $('#row');
  var letterWrap = $('#letterWrap');
  var current = 'cover';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function btn(label, cls, fn) {
    var b = document.createElement('button');
    b.className = 'btn' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function show(name) {
    stopMic();
    Object.keys(scenes).forEach(function (k) { scenes[k].classList.toggle('on', k === name); });
    current = name;
    row.innerHTML = '';
    wish.hidden = true;
    hint.hidden = false;
    if (name === 'cover') {
      hint.textContent = 'Tap the cover to open your card';
      row.appendChild(btn('Open the card', '', function () { show('env'); }));
    } else if (name === 'env') {
      hint.textContent = 'Tap the envelope to open the letter';
    } else if (name === 'cake') {
      resetCake();
      hint.textContent = 'Make a wish, then blow out the candles';
      row.appendChild(btn('Blow into the mic', '', startMic));
      row.appendChild(btn('Blow the candles', 'ghost', blowAll));
    }
  }

  /* Letter */
  function openLetter() { letterWrap.classList.add('on'); $('#closeLetter').focus({ preventScroll: true }); }
  function closeLetter() { letterWrap.classList.remove('on'); }
  $('#openCard').addEventListener('click', function () { show('env'); });
  $('#openLetter').addEventListener('click', openLetter);
  $('#closeLetter').addEventListener('click', closeLetter);
  $('#toCake').addEventListener('click', function () { closeLetter(); show('cake'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLetter(); });

  /* Candles */
  var flames = Array.prototype.slice.call(document.querySelectorAll('.flame'));
  var cakeEl = $('#cake');
  var finished = false;

  function resetCake() {
    finished = false;
    flames.forEach(function (f) { f.classList.remove('out', 'blowing'); f.style.removeProperty('--lean'); });
    document.querySelectorAll('.smoke').forEach(function (s) { s.remove(); });
    clearConfetti();
  }

  function snuff(f) {
    if (f.classList.contains('out')) return;
    f.classList.remove('blowing');
    f.classList.add('out');
    var s = document.createElement('span');
    s.className = 'smoke';
    s.style.left = f.style.left;
    s.style.top = f.style.top;
    cakeEl.appendChild(s);
    setTimeout(function () { s.remove(); }, 2600);
    checkDone();
  }

  function checkDone() {
    if (finished) return;
    if (flames.every(function (f) { return f.classList.contains('out'); })) {
      finished = true;
      stopMic();
      setTimeout(celebrate, 450);
    }
  }

  function blowAll() {
    flames.forEach(function (f, i) { setTimeout(function () { snuff(f); }, i * 260); });
  }
  flames.forEach(function (f) { f.addEventListener('click', function () { snuff(f); }); });

  function celebrate() {
    hint.hidden = true;
    wish.hidden = false;
    row.innerHTML = '';
    row.appendChild(btn('Read the letter again', 'ghost', openLetter));
    row.appendChild(btn('Light the candles again', '', function () { show('cake'); }));
    if (!reduce) confetti();
  }

  /* Microphone: blow to extinguish */
  var mic = null;
  function startMic() {
    if (mic) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { hint.textContent = 'Microphone not available here. Tap the candles instead.'; return; }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } })
      .then(function (stream) {
        var AC = window.AudioContext || window.webkitAudioContext;
        var ctx = new AC();
        var src = ctx.createMediaStreamSource(stream);
        var an = ctx.createAnalyser();
        an.fftSize = 512;
        src.connect(an);
        var buf = new Uint8Array(an.fftSize);
        var loud = 0, last = performance.now(), raf;
        mic = { stream: stream, ctx: ctx };
        hint.textContent = 'Listening… blow into your microphone';
        (function tick(now) {
          an.getByteTimeDomainData(buf);
          var sum = 0;
          for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; sum += v * v; }
          var rms = Math.sqrt(sum / buf.length);
          var dt = now - last; last = now;
          var blowing = rms > 0.09;
          loud = blowing ? loud + dt : Math.max(0, loud - dt * 2);
          var lean = Math.min(22, rms * 160);
          flames.forEach(function (f, i) {
            if (f.classList.contains('out')) return;
            f.classList.toggle('blowing', blowing);
            f.style.setProperty('--lean', (lean * (i % 2 ? 1 : .85)).toFixed(1));
          });
          if (loud > 450) { blowAll(); loud = 0; }
          if (mic) { mic.raf = requestAnimationFrame(tick); }
        })(last);
      })
      .catch(function () { hint.textContent = 'Microphone is blocked. Tap the candles or use the button instead.'; });
  }
  function stopMic() {
    if (!mic) return;
    cancelAnimationFrame(mic.raf);
    try { mic.stream.getTracks().forEach(function (t) { t.stop(); }); mic.ctx.close(); } catch (e) {}
    mic = null;
    flames.forEach(function (f) { f.classList.remove('blowing'); });
  }

  /* Confetti */
  var cv = $('#confetti'), cx = cv.getContext('2d'), parts = [], anim = null;
  function sizeCanvas() { var r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; }
  function clearConfetti() { parts = []; if (anim) cancelAnimationFrame(anim); anim = null; cx.clearRect(0, 0, cv.width, cv.height); }
  function confetti() {
    sizeCanvas();
    var colors = ['#d8453a', '#f0b84a', '#5b8db8', '#e9a3b0', '#7fae7a', '#9a8fc9', '#f6ead2'];
    var W = cv.width, H = cv.height;
    for (var i = 0; i < 160; i++) {
      parts.push({
        x: W * (.3 + Math.random() * .4), y: H * .3,
        vx: (Math.random() - .5) * 14 * devicePixelRatio, vy: (-Math.random() * 12 - 4) * devicePixelRatio,
        w: (6 + Math.random() * 7) * devicePixelRatio, h: (3 + Math.random() * 5) * devicePixelRatio,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[i % colors.length]
      });
    }
    var t0 = performance.now();
    (function frame(now) {
      cx.clearRect(0, 0, W, H);
      var alive = false;
      parts.forEach(function (p) {
        p.vy += .32 * devicePixelRatio; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (p.y < H + 30) alive = true;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
      });
      if (alive && now - t0 < 6000) anim = requestAnimationFrame(frame);
      else { cx.clearRect(0, 0, W, H); anim = null; }
    })(t0);
  }

  window.addEventListener('resize', function () { if (!anim) sizeCanvas(); });
  show('cover');
})();
</script>
</body>
</html>
